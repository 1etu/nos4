            "mainEntity": [

                "@type": "Question",
                "name": "What is nOS4?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "nOS4 is a recreation of Apple's iOS 4 that runs in a web browser. It rebuilds the iPhone lock screen, home screen and 24 apps in TypeScript, so you can use iOS 4 without owning an old iPhone."
                }
              },
              {
                "@type": "Question",
                "name": "Is this a real iOS 4 emulator?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "It is a simulator rather than an emulator. nOS4 does not run Apple's original ARM code or firmware. Every screen and app is rebuilt from scratch in web technology to look and behave like iOS 4."
                }
              },
              {
                "@type": "Question",
                "name": "Do I need to install or download anything?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. nOS4 runs entirely in the browser. Open nos4.fun on a phone or computer and it starts at the lock screen. You can also add it to your home screen to run it fullscreen."

                "name": "Does the Safari app really load websites?",

      html,

      .nos4-cta {

        --nos4-chip-shadow:

          0 1px 2px rgba(0, 0, 0, 0.45),
          0 1px 0 rgba(255, 255, 255, 0.45);
        position: fixed;
        top: 16px;
        right: 18px;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }

      .nos4-star {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        box-sizing: border-box;
        width: 250px;
        height: 54px;
        border-radius: 9px;
        border: var(--nos4-chip-edge);
        overflow: hidden;
        background: var(--nos4-chip-face);
        box-shadow: var(--nos4-chip-shadow);
        text-decoration: none;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
        transition:
          filter 0.15s ease-out,
          transform 0.06s ease-out;
      }

      .nos4-star::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 54%;
        background: var(--nos4-chip-gloss);
        border-radius: 8px 8px 50% 50% / 8px 8px 20px 20px;
        pointer-events: none;
      }

      .nos4-star::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 2;
        background: linear-gradient(
          104deg,
          rgba(255, 255, 255, 0) 42%,
          rgba(255, 255, 255, 0.3) 50%,
          rgba(255, 255, 255, 0) 58%
        );
        background-size: 260% 100%;
        background-repeat: no-repeat;
        animation: nos4-sheen 3.6s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes nos4-sheen {
        0%,
        58% {
          background-position: 190% 0;
        }
        100% {
          background-position: -90% 0;
        }
      }

      .nos4-star:hover {
        filter: brightness(1.14);
      }

      .nos4-star:active {
        transform: translateY(1px);
        filter: brightness(0.92);
        box-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.55),
          0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .nos4-star-mark,
      .nos4-star-label,
      .nos4-star-twinkle {
        position: relative;
        z-index: 1;
      }

      .nos4-star-mark {
        width: 22px;
        height: 22px;
        flex: none;
        fill: rgb(255, 255, 255);
        filter: drop-shadow(0 -1px 0 rgba(0, 0, 0, 0.55));
      }

      .nos4-star-label {
        font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 17px;
        font-weight: 700;
        line-height: 1;
        color: rgb(255, 255, 255);
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.55);
      }

      .nos4-star-twinkle {
        width: 18px;
        height: 18px;
        flex: none;
        fill: rgb(255, 214, 87);
        transform-origin: 50% 50%;
        animation: nos4-star-pop 3.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      @keyframes nos4-star-pop {
        0%,
        60% {
          transform: scale(1) rotate(0deg);
          filter: none;
        }
        70% {
          transform: scale(1.45) rotate(-14deg);
          filter: drop-shadow(0 0 6px rgba(255, 214, 87, 0.95));
        }
        100% {
          transform: scale(1) rotate(0deg);
          filter: none;
        }
      }

      .nos4-hunt {
        display: block;
        line-height: 0;
        border-radius: 9px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        transition: filter 0.15s ease-out;
      }

      .nos4-hunt:hover {
        filter: brightness(1.1);
      }

      .nos4-hunt img {
        display: block;
        width: 250px;
        height: 54px;
      }

      .nos4-hunt-mark {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .nos4-star::after,
        .nos4-star-twinkle {
          animation: none;
        }
      }

      @media (max-width: 820px), (hover: none) and (pointer: coarse) {
        .nos4-cta {
          display: none;
        }
      }
    </style>
